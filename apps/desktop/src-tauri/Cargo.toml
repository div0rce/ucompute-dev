[package]
name = "common-desktop"
version = "0.1.0"
description = "Common desktop application (Tauri shell around the Common daemon)"
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (matters on Windows).
name = "common_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Job object: the daemon ends with the app (already in the build through tauri/tokio). Shell,
# Registry (SHELLEXECUTEINFOW) and SystemInformation: the elevated firewall rule (src/firewall.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
