# cargo-deny configuration (ADR-0001 §Decision 2, F-06-09). Run: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices, no vulnerability, in crates that only a Linux desktop build compiles (there is no Linux
# desktop app; neither the macOS DMG nor the Linux daemon tarball contains them). Re-check when one is built.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro of gtk-rs glib-macros (Tauri on Linux)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: D-Bus, via zbus <- tauri-plugin-opener on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: D-Bus, via zbus <- tauri-plugin-opener on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: D-Bus, via zbus <- tauri-plugin-opener on Linux" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "OpenSSL", "BSL-1.0",
  # webpki-roots (Mozilla's CA root list, via rustls): a permissive data licence, no copyleft; its text ships in
  # THIRD_PARTY_NOTICES (scripts/gen_notices.py).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # GPL/AGPL projects we must never link (ADR-0001)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
