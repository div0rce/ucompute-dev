[package]
name = "ucompute-cli"
description = "The `ucompute` command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ucompute"
path = "src/main.rs"

[dependencies]
ucompute-core = { workspace = true }
ucompute-hardware = { workspace = true }
ucompute-models = { workspace = true }
ucompute-artifacts = { workspace = true }
ucompute-runtime = { workspace = true }
ucompute-api = { workspace = true }
ucompute-identity = { workspace = true }
ucompute-policy = { workspace = true }
ucompute-observability = { workspace = true }
ucompute-network = { workspace = true }
clap = { workspace = true }
# io-std: tokio::io::stdin for the chat REPL so Ctrl-C can be selected against the read.
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
# Already built for ucompute-api (same features): CLI mesh mutations go through a running daemon's API.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# SIGPIPE -> SIG_DFL so `ucompute models list | head` exits quietly instead of panicking (unix only).
libc = "0.2.190"
