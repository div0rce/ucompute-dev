[package]
name = "common-cli"
description = "The `common` command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "common"
path = "src/main.rs"

[dependencies]
common-core = { workspace = true }
common-hardware = { workspace = true }
common-models = { workspace = true }
common-artifacts = { workspace = true }
common-runtime = { workspace = true }
common-api = { workspace = true }
clap = { workspace = true }
# io-std: tokio::io::stdin for the chat REPL so Ctrl-C can be selected against the read.
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# SIGPIPE -> SIG_DFL so `common models list | head` exits quietly instead of panicking (unix only).
libc = "0.2.190"
