[package]
name = "ucompute-runtime"
description = "Inference backend adapters (F-01-06): llama.cpp via a supervised pinned llama-server process (ADR-0002)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ucompute-core = { workspace = true }
ucompute-models = { workspace = true }
ucompute-hardware = { workspace = true }
ucompute-artifacts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# SIGTERM for graceful engine stop (tokio only offers SIGKILL); already a transitive dep of tokio/mio.
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Job object so the engine dies with the daemon (already in the build through tokio/quinn).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
