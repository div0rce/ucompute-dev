// Common peer control protocol v1 (ADR-0003 D5). Frame = u32 BE length || protobuf ControlMessage.
// The Rust structs in crates/common-network/src/proto.rs mirror this file by hand (no protoc at
// build time); `proto::tests::control_proto_mirrors_proto_rs` fails when a message name or field
// tag differs. One field per line: that test parses this file line by line.
//
// QUIC application close codes (wire-visible; crates/common-network/src/transport.rs CLOSE_*):
// 0 ok, 0x5245 'RE' revoked, 0x5541 'UA' unauthorized, 0x5056 'PV' protocol, 0x4654 'FT' frame too
// large, 0x4844 'HD' held: the closing device's user disconnected the peer and refuses it until they
// connect it again (read as `peer_held`; builds without it read `peer_lost`).
//
// Protocol minor 1 (PROTOCOL_MINOR = 1, HELD_EXCHANGE_MINOR = 1): a device that holds its peer
// answers the peer's Capabilities with ErrorMsg{code:"peer_held"} instead of its own Capabilities;
// the holder then sends its RevocationMsg frames and ends its stream, the held side reads to that
// end, sends its own and ends its stream, and the holder reads to that end and closes with
// CLOSE_HELD. A minor-0 peer gets no ErrorMsg (it would read one there as a protocol error): the
// holder still sends its Hello and verifies the peer's Capabilities, then closes with CLOSE_HELD
// without sending its own and without the revocation exchange. No message or field was added.
syntax = "proto3";
package common.v1;

message Hello {
  uint32 major = 1;
  uint32 minor = 2;
  string common_version = 3;
  bytes peer_id = 4;
  bytes nonce = 5;
}

// Capability record (F-02-04). Travels only as the signed bytes inside SignedCapabilities.
message Capabilities {
  // The old in-record signature; signatures now live in SignedCapabilities.
  reserved 10;
  uint32 schema_version = 1;
  bytes peer_id = 2;
  string common_version = 3;
  // Exactly the `common hardware --json` document.
  string hardware_json = 4;
  uint64 free_memory_bytes = 5;
  // "<name> <release> <platform>", e.g. "llama.cpp b11609 macos-arm64".
  repeated string engines = 6;
  repeated string cached_model_sha256 = 7;
  repeated string groups = 8;
  uint64 issued_at = 9;
}

// The exact Capabilities bytes the sender signed, plus Ed25519 over
// "common/1 capabilities\0" || record. Verified before the record is decoded.
message SignedCapabilities {
  bytes record = 1;
  bytes signature = 2;
}

message Status {
  uint64 free_memory_bytes = 1;
  uint32 active_sessions = 2;
  uint32 queue_depth = 3;
  optional string loaded_model_id = 4;
}

message ErrorMsg {
  // A stable common_core::ErrorCode string, e.g. "peer_lost".
  string code = 1;
  string message = 2;
}

message RevocationMsg {
  uint64 seq = 1;
  bytes peer_id = 2;
  bytes revoked_by = 3;
  string at_utc = 4;
  bytes signature = 5;
}

// Mode B: run one whole generation on the peer. request_json = common_runtime::GenerateRequest.
message RemoteRequest {
  string request_id = 1;
  string model_id = 2;
  string model_sha256 = 3;
  string request_json = 4;
  string privacy = 5;
}

// One streamed event back: event_json = common_runtime::GenerateEvent; the last one has done = true.
message RemoteChunk {
  string request_id = 1;
  string event_json = 2;
  bool done = 3;
}

message Cancel {
  string request_id = 1;
}

message ControlMessage {
  // Tag 2 was an unsigned Capabilities; an old peer sees tag 9 as an unknown variant.
  reserved 2;
  oneof body {
    Hello hello = 1;
    SignedCapabilities capabilities = 9;
    Status status = 3;
    ErrorMsg error = 4;
    RevocationMsg revocation = 5;
    RemoteRequest remote_request = 6;
    RemoteChunk remote_chunk = 7;
    Cancel cancel = 8;
  }
}
