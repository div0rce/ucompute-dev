[workspace]
resolver = "2"
members = [
  "crates/common-core",
  "crates/common-hardware",
  "crates/common-models",
  "crates/common-artifacts",
  "crates/common-runtime",
  "crates/common-api",
  "crates/common-cli",
  "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/div0rce/common"
rust-version = "1.85"

[workspace.dependencies]
common-core = { path = "crates/common-core" }
common-hardware = { path = "crates/common-hardware" }
common-models = { path = "crates/common-models" }
common-artifacts = { path = "crates/common-artifacts" }
common-runtime = { path = "crates/common-runtime" }
common-api = { path = "crates/common-api" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tar = "0.4"
flate2 = "1"
prometheus = { version = "0.14", default-features = false }
tempfile = "3"
