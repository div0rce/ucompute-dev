[workspace]
resolver = "2"
members = [
  "crates/ucompute-core",
  "crates/ucompute-hardware",
  "crates/ucompute-models",
  "crates/ucompute-artifacts",
  "crates/ucompute-runtime",
  "crates/ucompute-api",
  "crates/ucompute-cli",
  "crates/ucompute-identity",
  "crates/ucompute-policy",
  "crates/ucompute-observability",
  "crates/ucompute-network",
  "tests/integration",
  "apps/desktop/src-tauri",
]
# `cargo build` / `cargo test` with no -p builds the daemon crates only; the Tauri shell is heavy and built explicitly
# with `cargo build -p ucompute-desktop` or `pnpm tauri build` inside apps/desktop.
default-members = [
  "crates/ucompute-core",
  "crates/ucompute-hardware",
  "crates/ucompute-models",
  "crates/ucompute-artifacts",
  "crates/ucompute-runtime",
  "crates/ucompute-api",
  "crates/ucompute-cli",
  "crates/ucompute-identity",
  "crates/ucompute-policy",
  "crates/ucompute-observability",
  "crates/ucompute-network",
  "tests/integration",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/div0rce/ucompute"
rust-version = "1.85"

[workspace.dependencies]
ucompute-core = { path = "crates/ucompute-core" }
ucompute-hardware = { path = "crates/ucompute-hardware" }
ucompute-models = { path = "crates/ucompute-models" }
ucompute-artifacts = { path = "crates/ucompute-artifacts" }
ucompute-runtime = { path = "crates/ucompute-runtime" }
ucompute-api = { path = "crates/ucompute-api" }
ucompute-identity = { path = "crates/ucompute-identity" }
ucompute-policy = { path = "crates/ucompute-policy" }
ucompute-observability = { path = "crates/ucompute-observability" }
ucompute-network = { path = "crates/ucompute-network" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tar = "0.4"
flate2 = "1"
# Windows engine releases ship as .zip; deflate only, through flate2 (already used for .tar.gz).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
prometheus = { version = "0.14", default-features = false }
tempfile = "3"
# M3 peer networking (ADR-0003): QUIC + TLS 1.3 raw public keys, Ed25519 via ring, SPAKE2 pairing, mDNS, protobuf framing
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
spake2 = "0.4"
hmac = "0.12"
mdns-sd = "0.21"
prost = "0.14"
libc = "0.2"

# Release profile (Tauri size guideline): applies to the whole workspace, including the `ucompute` sidecar.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
