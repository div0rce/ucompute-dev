# Gate A (build) + Gate B (inference) on real fixtures. Runs once the owner authorizes pushing (B-007).
name: ci
on:
  push:
    branches: [main, "integration/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  registry:
    name: requirements registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/validate_registry.py
      - run: python3 -m unittest discover -s tests/registry -v

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude common-desktop --all-targets -- -D warnings
      - run: cargo build --workspace --exclude common-desktop
      - name: unit tests (no fixtures)
        run: cargo test --workspace --exclude common-desktop
      - name: real-inference tests (macOS arm64 only; pinned engine + tiny fixtures)
        if: matrix.os == 'macos-14'
        run: |
          scripts/fetch-fixtures.sh
          COMMON_HOME=$PWD/.common cargo test --workspace --exclude common-desktop -- --nocapture
      - name: dependency licenses and advisories
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  desktop:
    name: desktop (lint, unit, a11y)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
