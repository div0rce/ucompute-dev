# Gate A (build) + Gate B (inference). Pull requests and pushes to main run on Linux only: macOS minutes count 10x
# against a private repository's free quota, so the macOS job runs only when dispatched by hand (D-028).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  registry:
    name: requirements registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/validate_registry.py
      - run: python3 -m unittest discover -s tests/registry -v

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-14","ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude ucompute-desktop --all-targets -- -D warnings
      - run: cargo build --workspace --exclude ucompute-desktop
      - name: unit tests (no fixtures)
        run: cargo test --workspace --exclude ucompute-desktop
      - name: real-inference tests (macOS arm64 only; pinned engine + tiny fixtures)
        if: matrix.os == 'macos-14'
        run: |
          scripts/fetch-fixtures.sh
          UCOMPUTE_HOME=$PWD/.ucompute cargo test --workspace --exclude ucompute-desktop -- --nocapture
      - name: dependency licenses and advisories
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  desktop:
    name: desktop (lint, unit, a11y)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/desktop/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  python:
    name: offline Python suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests/distributed/two_machine
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/soak

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The released binary, not gitleaks-action (it needs pull-request API access the default token lacks here).
      # .gitleaks.toml uses global [[allowlists]] (gitleaks 8.25 or later): pin the version the scans were proven with.
      - name: gitleaks git (whole history)
        env: { V: "8.30.1" }
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$V"
          curl -sSfLO "$base/gitleaks_${V}_linux_x64.tar.gz" -O "$base/gitleaks_${V}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${V}_checksums.txt"
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

